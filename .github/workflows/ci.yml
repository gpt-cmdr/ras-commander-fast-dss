name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: Sources and notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/verify_sources.py
      - run: python scripts/dependency_notices.py --check

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # dss-py is a Python extension module; the wheel job below tests it.
      - run: cargo test --locked --workspace --exclude dss-py

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p dss-wasm --target wasm32-unknown-unknown

  wheel:
    name: Wheel tests (${{ matrix.os }}, Python 3.10 and 3.13)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        id: py310
        with:
          python-version: '3.10'
      - uses: actions/setup-python@v6
        id: py313
        with:
          python-version: '3.13'
      - name: Build one abi3 wheel
        shell: bash
        run: |
          "${{ steps.py313.outputs.python-path }}" -m pip install "maturin>=1.9,<2"
          "${{ steps.py313.outputs.python-path }}" -m maturin build --release --locked --out dist
      - name: Python tests against the installed wheel
        shell: bash
        # -I keeps the repository's python/ tree off sys.path, so the tests import the wheel.
        run: |
          for py in "${{ steps.py310.outputs.python-path }}" "${{ steps.py313.outputs.python-path }}"; do
            "$py" -m venv "venv-$("$py" -c 'import sys; print(sys.version_info[1])')"
          done
          for venv in venv-10 venv-13; do
            if [ -x "$venv/bin/python" ]; then py="$venv/bin/python"; else py="$venv/Scripts/python.exe"; fi
            "$py" -m pip install dist/*.whl pytest
            "$py" -I tests/smoke_wheel.py
            "$py" -I -m pytest -q
          done

  sdist:
    name: Source distribution builds and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install "maturin>=1.9,<2"
      - run: python -m maturin sdist --out dist
      - name: Build from the sdist in a fresh venv
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/python -m pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/python -I tests/smoke_wheel.py
