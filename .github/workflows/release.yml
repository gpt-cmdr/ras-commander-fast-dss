name: Release
# A release starts only when the maintainer publishes a GitHub Release whose tag is
# v<version>. Nothing here runs on a push, a tag push or a dispatch. Every job runs on a
# GitHub-hosted runner and is attached to the protected `pypi` environment, so each job
# waits for the environment's required reviewer before a runner starts. Approve the build
# jobs first; the publish job asks again once the artifacts exist.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    uses: ./.github/workflows/build.yml

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/check_release_tag.py
      - run: python scripts/verify_sources.py
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: python -m pip install maturin==1.15.0
      - run: python -m maturin sdist --out dist
      - name: Build from the sdist in a fresh venv and smoke-test it
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/python -m pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/python -I tests/smoke_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist-source
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attach to the GitHub Release and publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/check_release_tag.py
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        # SHA256SUMS stays outside dist/, which holds only the distributions PyPI receives.
        run: |
          ls dist
          (cd dist && sha256sum *.whl *.tar.gz) > SHA256SUMS
          cat SHA256SUMS
          test "$(ls dist | wc -l)" -eq 8
      # The release and its notes are written by hand when it is published; this only adds
      # the artifacts. It never creates a release or generates notes. It is safe to rerun:
      # missing assets are uploaded, byte-identical ones are kept, and an existing asset with
      # other bytes (or one this run does not produce) fails the job before anything is
      # uploaded. Nothing is ever replaced.
      - name: Attach the artifacts to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release_assets.py attach "$RELEASE_TAG" dist SHA256SUMS
      # PyPI steps run only when the repository variable PUBLISH_PYPI is true. Files already on
      # PyPI for this version must be byte-identical to this build; skip-existing then lets a
      # rerun finish an interrupted upload without uploading anything twice.
      - name: Files already on PyPI match this build
        if: ${{ vars.PUBLISH_PYPI == 'true' }}
        run: python scripts/release_assets.py pypi-check dist SHA256SUMS
      # With PYPI_API_TOKEN unset, the action uses the PyPI trusted publisher for this workflow
      # and the pypi environment.
      - name: Publish to PyPI
        if: ${{ vars.PUBLISH_PYPI == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
      # Checks exactly the distributions in SHA256SUMS: with Trusted Publishing the action has
      # left a .publish.attestation file next to each one in dist/, which PyPI does not list.
      - name: Every distribution is on PyPI with this build's bytes
        if: ${{ vars.PUBLISH_PYPI == 'true' }}
        run: python scripts/release_assets.py pypi-check dist SHA256SUMS --require-all

  # crates.io publishing stays off: every crate has publish = false, and PUBLISH_CRATES is unused.
